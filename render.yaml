services:
  - type: web
    name: honey
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SQLITE_PATH
        value: /opt/render/project/src/data/honey.sqlite
      - key: VITE_API_URL
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: AI_PROVIDER
        value: auto
      - key: AI_WEB_SEARCH
        value: always
      - key: OPENROUTER_SEARCH_MAX_RESULTS
        value: "5"
      - key: OPENROUTER_SEARCH_MAX_TOTAL_RESULTS
        value: "8"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/auto
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: llama-3.3-70b
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: SAMBANOVA_MODEL
        value: Meta-Llama-3.1-8B-Instruct
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://honey.onrender.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        value: ahmadjonzokirov54@gmail.com
      - key: DEFAULT_FROM_EMAIL
        value: ahmadjonzokirov54@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
